name: SkillLoop Python verification
on:
  push:
    branches: [main]
    paths: ['skillloop/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'requirements-dev.txt', '.github/workflows/python.yml']
  pull_request:
    paths: ['skillloop/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'requirements-dev.txt', '.github/workflows/python.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[p1]" -r requirements-dev.txt
      - run: python -m pytest --hypothesis-seed=20260908 -o addopts='' -q
        env:
          PYTHONUTF8: '1'
          SKILLLOOP_RUN_EXCEL_TESTS: '0'
