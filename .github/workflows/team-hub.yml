name: Deploy Nowhere Workspace
on:
  push:
    branches: [main, codex/team-hub]
    paths: ["team-hub/**", ".github/workflows/team-hub.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-hub-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: team-hub
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          # Build the triggering revision, including the web source submitted on main.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: team-hub/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - name: Verify comment security rules in isolated emulator
        run: npx --yes firebase-tools@15.29.0 emulators:exec --only firestore --project demo-nowhere "npm run test:rules"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: team-hub/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
