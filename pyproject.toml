[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillloop"
version = "0.0.1"
description = "Agent SkillLoop — 한 Agent의 해결 경험을 다음 Agent의 Skill로 (MVP P0)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skillloop = "skillloop.cli:main"

[tool.setuptools]
packages = ["skillloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
