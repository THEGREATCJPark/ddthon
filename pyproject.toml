[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillloop"
version = "0.0.1"
description = "Agent SkillLoop — 한 Agent의 해결 경험을 다음 Agent의 Skill로 (MVP P0)"
requires-python = ">=3.10"
dependencies = ["setuptools>=61", "wheel"]

[project.optional-dependencies]
p1 = ["pywin32; sys_platform == 'win32'", "openpyxl>=3.1", "matplotlib>=3.9"]

[project.scripts]
skillloop = "skillloop.cli:main"

[tool.setuptools]
packages = ["skillloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 격리 venv 생성 등 느린 테스트(오프라인이지만 시간 소요)",
]
